# Optional: deploy to GitHub Pages with Actions.
# Enable it in: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (If you prefer "Deploy from a branch" → main / root, you can delete this file.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stop the deploy if the data has errors (validate.py only uses the standard library).
      - name: Validate data
        run: python scripts/validate.py

      - uses: actions/configure-pages@v5

      # Publish only what the website needs.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js data covers _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
